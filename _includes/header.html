<header class="header" itemscope itemtype="http://schema.org/SiteNavigationElement" aria-label="Main navigation">
  <div class="container">
    <div class="header__inner">
      <a class="header__home" href="{{ '/' | relative_url }}" itemprop="url">
        <span itemprop="name">Home</span>
      </a>
      <nav class="header__links" aria-label="Site sections">
        <div class="container header__links-wrapper">
          {% for item in site.navigation %}
            <a class="header__link" href="{{ item.link | relative_url }}" itemprop="url">
              <span itemprop="name">{{ item.name }}</span>
            </a>
          {% endfor %}
          <button class="header__search-button" type="button" aria-label="Search posts" aria-haspopup="dialog" aria-controls="site-search">
            <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
              <circle cx="10.75" cy="10.75" r="6.75"></circle>
              <path d="m16 16 4 4"></path>
            </svg>
            <span>Search</span>
          </button>
        </div>
      </nav>
      <button class="header__toggle" type="button" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>

<div class="site-search" id="site-search" data-search-index="{{ '/search.json' | relative_url }}" hidden>
  <div class="site-search__backdrop" data-search-close></div>
  <section class="site-search__dialog" role="dialog" aria-modal="true" aria-labelledby="site-search-title">
    <header class="site-search__header">
      <div>
        <p class="site-search__eyebrow">Search the journal</p>
        <h2 id="site-search-title">Find a post</h2>
      </div>
      <button class="site-search__close" type="button" aria-label="Close search" data-search-close>&times;</button>
    </header>
    <label class="site-search__field">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
        <circle cx="10.75" cy="10.75" r="6.75"></circle>
        <path d="m16 16 4 4"></path>
      </svg>
      <span class="visually-hidden">Search posts</span>
      <input id="site-search-input" type="search" inputmode="search" autocomplete="off" placeholder="Search by title, topic, or keyword&hellip;">
    </label>
    <p class="site-search__status" id="site-search-status" aria-live="polite">Start typing to search Research, Life, and News posts.</p>
    <div class="site-search__results" id="site-search-results"></div>
  </section>
</div>
