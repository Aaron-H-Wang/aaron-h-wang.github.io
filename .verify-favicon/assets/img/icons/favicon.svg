<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Overlapping AA mountain monogram</title>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- First A: a curved snow line above a lava-dark mountain base. -->
    <g>
      <path d="M12.4 37C10.2 43.8 7.8 49.8 5.5 55M33.6 37c2.2 6.8 4.6 12.8 6.9 18" stroke="#111214" stroke-width="7.2"/>
      <path d="M12.4 37C10.2 43.8 7.8 49.8 5.5 55M33.6 37c2.2 6.8 4.6 12.8 6.9 18" stroke="#1b1816" stroke-width="5.2"/>
      <path d="M12.4 37C15.3 27 19.2 15.2 23 9c3.8 6.2 7.7 18 10.6 28M12.4 37h21.2" stroke="#718491" stroke-width="7.4" opacity=".78"/>
      <path d="M12.4 37C15.3 27 19.2 15.2 23 9c3.8 6.2 7.7 18 10.6 28M12.4 37h21.2" stroke="#fbfdff" stroke-width="5.2"/>
    </g>

    <!-- Second A keeps the original overlap, with subtly offset snow and lava tones. -->
    <g>
      <path d="M30.4 37C28.2 43.8 25.8 49.8 23.5 55M51.6 37c2.2 6.8 4.6 12.8 6.9 18" stroke="#111214" stroke-width="7.2"/>
      <path d="M30.4 37C28.2 43.8 25.8 49.8 23.5 55M51.6 37c2.2 6.8 4.6 12.8 6.9 18" stroke="#282320" stroke-width="5.2"/>
      <path d="M30.4 37C33.3 27 37.2 15.2 41 9c3.8 6.2 7.7 18 10.6 28M30.4 37h21.2" stroke="#718491" stroke-width="7.4" opacity=".78"/>
      <path d="M30.4 37C33.3 27 37.2 15.2 41 9c3.8 6.2 7.7 18 10.6 28M30.4 37h21.2" stroke="#edf6fb" stroke-width="5.2"/>
    </g>
  </g>
</svg>
