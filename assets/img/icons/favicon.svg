<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Overlapping AA mountain monogram</title>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Draw both lava-dark bases first so every snow-white crossing stays on top. -->
    <path d="M12.6 37C10.3 43.3 8.4 49.7 5.5 55M33.4 37c2.3 6.3 4.2 12.7 7.1 18" stroke="#111214" stroke-width="7.2"/>
    <path d="M12.6 37C10.3 43.3 8.4 49.7 5.5 55M33.4 37c2.3 6.3 4.2 12.7 7.1 18" stroke="#1b1816" stroke-width="5.2"/>
    <path d="M30.6 37C28.3 43.3 26.4 49.7 23.5 55M51.4 37c2.3 6.3 4.2 12.7 7.1 18" stroke="#111214" stroke-width="7.2"/>
    <path d="M30.6 37C28.3 43.3 26.4 49.7 23.5 55M51.4 37c2.3 6.3 4.2 12.7 7.1 18" stroke="#282320" stroke-width="5.2"/>

    <!-- Slight inward curves turn the overlapping A forms into paired mountain peaks. -->
    <path d="M12.6 37C15.2 27.8 19.7 14.4 23 9c3.3 5.4 7.8 18.8 10.4 28M12.6 37h20.8" stroke="#718491" stroke-width="7.4" opacity=".78"/>
    <path d="M30.6 37C33.2 27.8 37.7 14.4 41 9c3.3 5.4 7.8 18.8 10.4 28M30.6 37h20.8" stroke="#718491" stroke-width="7.4" opacity=".78"/>
    <path d="M12.6 37C15.2 27.8 19.7 14.4 23 9c3.3 5.4 7.8 18.8 10.4 28M12.6 37h20.8" stroke="#fbfdff" stroke-width="5.2"/>
    <path d="M30.6 37C33.2 27.8 37.7 14.4 41 9c3.3 5.4 7.8 18.8 10.4 28M30.6 37h20.8" stroke="#edf6fb" stroke-width="5.2"/>
  </g>
</svg>
